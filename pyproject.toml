[project]
name = "recruitement-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Srijan-Petwal", email = "srijan8a@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "black>=26.5.1",
    "dotenv>=0.9.9",
    "isort>=9.0.1",
    "langchain>=1.4.2",
    "langchain-google-genai>=4.4.0",
